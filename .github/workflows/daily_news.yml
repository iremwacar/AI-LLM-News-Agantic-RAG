name: Daily AI News Agent

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
    - name: Kodu Klonla
      uses: actions/checkout@v3

    - name: Python Kur
      uses: actions/setup-python@v4
      with:
        python-version: '3.10' # HATA DÜZELTİLDİ: 'python-python-version' değil, 'python-version'

    - name: Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install crewai==0.63.0 litellm tavily-python beautifulsoup4 requests python-dotenv
        
    - name: Ajanı Çalıştır
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      run: python main.py