name: Daily AI News Agent

on:
  schedule:
    # Cron formatı: Her sabah UTC ile 05:00'te çalışır (Türkiye saatiyle 08:00)
    - cron: '0 5 * * *'
  workflow_dispatch: # İstediğinde GitHub panelinden elle de tetikleyebilmen için

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
    - name: Kodu Klonla
      uses: actions/checkout@v3

    - name: Python Kur
      uses: actions/setup-python@v4
      with:
        python-python-version: '3.10'

    - name: Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install crewai litellm tavily-python beautifulsoup4 requests

    - name: Ajanı Çalıştır
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      run: python main.py